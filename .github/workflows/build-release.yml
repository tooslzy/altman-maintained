name: Build and Release (Manual)

on:
    workflow_dispatch: {}

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: windows-latest

        env:
            VCPKG_ROOT: C:\vcpkg

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up MSVC
              uses: ilammy/msvc-dev-cmd@v1

            - name: Clone vcpkg
              run: |
                  git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
                  C:\vcpkg\bootstrap-vcpkg.bat

            - name: Clean workspace
              shell: pwsh
              run: |
                  Remove-Item -Recurse -Force build, vcpkg_installed, altman.zip -ErrorAction SilentlyContinue

            - name: Create build directory
              shell: pwsh
              run: New-Item -ItemType Directory -Force -Path build

            - name: Install dependencies
              run: C:\vcpkg\vcpkg.exe install --triplet x64-windows-static

            - name: Configure CMake
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake -A x64 -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_BUILD_TYPE=Release

            - name: Build project
              run: cmake --build build --config Release --parallel

            - name: Package release
              shell: pwsh
              run: |
                  $Timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
                  $ReleaseDir = "build\altman\Release"
                  if (-not (Test-Path $ReleaseDir)) { throw "Release folder not found: $ReleaseDir" }

                  Compress-Archive -Path (Join-Path $ReleaseDir '*') -DestinationPath "altman.zip" -Force
                  echo "RELEASE_TIMESTAMP=$Timestamp" >> $env:GITHUB_ENV

            - name: Create release
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $Timestamp = $env:RELEASE_TIMESTAMP
                  $Tag = "$Timestamp"
                  gh release create $Tag "altman.zip" `
                    --title "AltMan $Timestamp"
